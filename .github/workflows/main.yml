name: Build TOWER Rush APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project files + HTML
        run: |
          cat > package.json << 'EOF'
          cat > capacitor.config.ts << 'EOF'
          import { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: 'com.towerrush.app',
            appName: 'TOWER Rush',
            webDir: 'www'
          };
          export default config;
          EOF

          mkdir -p www
          cat > www/index.html << 'HTML_INDEX_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>AXOL</title>
          <style>
              @import url('https://fonts.googleapis.com/css2?family=Bungee&display=swap');
              * {margin: 0; padding: 0; box-sizing: border-box}
              body {background: #000; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Bungee', sans-serif; overflow: hidden;}
              :root {--start-gap: 12px; --logo-size: 40px; --reopen-gap: calc(50% - 100px);}
              .stage {position: relative; display: flex; align-items: center; justify-content: center; height: 80px;}
              .axol {color: #fff; font-size: 42px; letter-spacing: 6px; display: flex; position: relative; z-index: 1;}
              .axol span {display: inline-block; transform-origin: center; animation: dissolveChar 0.35s cubic-bezier(.4,0,.2,1) forwards;}
              .axol span:nth-child(1) {animation-delay: 2.2s}
              .axol span:nth-child(2) {animation-delay: 2.4s}
              .axol span:nth-child(3) {animation-delay: 2.6s}
              .axol span:nth-child(4) {animation-delay: 2.8s}
              .line {position: absolute; width: 3px; height: 60px; background: #fff; top: 50%; transform: translateY(-50%);}
              .line-left {left: calc(-1 * var(--start-gap)); animation: collideAndReopenLeft 4s cubic-bezier(.85,0,.15,1) 2s forwards;}
              .line-right {right: calc(-1 * var(--start-gap)); animation: collideAndReopenRight 4s cubic-bezier(.85,0,.15,1) 2s forwards;}
              .powered {position: absolute; display: flex; align-items: center; gap: 12px; color: #fff; font-size: 14px; letter-spacing: 2px; opacity: 0; animation: showPowered 0.5s ease-out 4.8s forwards;}
              .powered-logo {width: var(--logo-size); height: var(--logo-size); object-fit: contain;}
              @keyframes collideAndReopenLeft {0% {left: calc(-1 * var(--start-gap))} 50% {left: 50%} 100% {left: var(--reopen-gap)}}
              @keyframes collideAndReopenRight {0% {right: calc(-1 * var(--start-gap))} 50% {right: 50%} 100% {right: var(--reopen-gap)}}
              @keyframes dissolveChar {0% {opacity: 1; transform: scaleX(1); filter: blur(0)} 100% {opacity: 0; transform: scaleX(0); filter: blur(2px)}}
              @keyframes showPowered {0% {opacity: 0; transform: scale(0.9)} 100% {opacity: 1; transform: scale(1)}}
              @media (max-width: 600px) {.axol {font-size: 32px; letter-spacing: 4px} .line {height: 50px; width: 2px} .powered {font-size: 12px} :root {--start-gap: 8px; --logo-size: 52px; --reopen-gap: calc(50% - 80px);}}
          </style>
          </head>
          <body>
              <div class="stage">
                  <div class="line line-left"></div>
                  <div class="axol">
                      <span>A</span><span>X</span><span>O</span><span>L</span>
                  </div>
                  <div class="line line-right"></div>
                  <div class="powered">
                      <span>POWERED BY</span>
                      <img src="company_logo.png" alt="B" class="powered-logo">
                  </div>
              </div>
              <script>
                  setTimeout(() => {
                      window.location.href = 'main.html';
                  }, 7000);
              </script>
          </body>
          </html>
          HTML_INDEX_EOF

          cat > www/main.html << 'HTML_MAIN_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="X-UA-Compatible" content="IE=edge" />
            <meta name="viewport" content="width=device-width,user-scalable=no" />
            <script src="https://codepen.io/steveg3003/pen/zBVakw"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r83/three.min.js"></script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/latest/TweenMax.min.js"></script>
            <title>- Tower Rush</title>
            <link rel="icon" href="https://i.ibb.co/M6KTWnf/pic.jpg" />
            <link rel="stylesheet" href="style.css" />
            <style>
              @import url("https://fonts.googleapis.com/css?family=");
              html, body {margin: 0; overflow: hidden; height: 100%; width: 100%; position: relative; font-family: "Comfortaa", cursive}
              #container {width: 100%; height: 100%}
              #container #score {position: absolute; top: 20px; width: 100%; text-align: center; font-size: 10vh; transition: transform 0.5s ease; color: #334; transform: translatey(-200px) scale(1)}
              #container #game {position: absolute; top: 0; right: 0; bottom: 0; left: 0}
              #container .game-over {position: absolute; top: 0; left: 0; width: 100%; height: 85%; display: flex; flex-direction: column; align-items: center; justify-content: center}
              #container .game-over * {transition: opacity 0.5s ease, transform 0.5s ease; opacity: 0; transform: translatey(-50px); color: #334}
              #container .game-over h2 {margin: 0; padding: 0; font-size: 40px}
              #container .game-ready {position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-around}
              #container .game-ready #start-button {transition: opacity 0.5s ease, transform 0.5s ease; opacity: 0; transform: translatey(-50px); border: 3px solid #334; padding: 10px 20px; background-color: transparent; color: #334; font-size: 30px}
              #container #instructions {position: absolute; width: 100%; top: 16vh; left: 0; text-align: center; transition: opacity 0.5s ease, transform 0.5s ease; opacity: 0}
              #container #instructions.hide {opacity: 0 !important}
              #container.playing #score, #container.resetting #score {transform: translatey(0px) scale(1)}
              #container.playing #instructions {opacity: 1}
              #container.ready .game-ready #start-button {opacity: 1; transform: translatey(0)}
              #container.ended #score {transform: translatey(6vh) scale(1.5)}
              #container.ended .game-over * {opacity: 1; transform: translatey(0)}
              #container.ended .game-over p {transition-delay: 0.3s}
            </style>
          </head>
          <body>
            <script src="script.js" async></script>
            <div id="container">
              <div id="game"></div>
              <div id="score">0</div>
              <div id="instructions"> Click (or press the spacebar) to place the block </div>
              <div class="game-over">
                <h2>Game Over</h2>
                <p>You did great, you're the best.</p>
                <p>Click or spacebar to start again</p>
              </div>
              <div class="game-ready">
                <div id="start-button">Start</div>
                <div></div>
              </div>
            </div>
            <footer>Project By -: TANAY PADAR</footer>
            <script>
              console.clear();
              var Stage = (function() {
                function Stage() {
                  var _this = this;
                  this.render = function() { this.renderer.render(this.scene, this.camera); };
                  this.add = function(elem) { this.scene.add(elem); };
                  this.remove = function(elem) { this.scene.remove(elem); };
                  this.container = document.getElementById("game");
                  this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
                  this.renderer.setSize(window.innerWidth, window.innerHeight);
                  this.renderer.setClearColor("#D0CBC7", 1);
                  this.container.appendChild(this.renderer.domElement);
                  this.scene = new THREE.Scene();
                  var aspect = window.innerWidth / window.innerHeight;
                  var d = 20;
                  this.camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, -100, 1000);
                  this.camera.position.x = 2;
                  this.camera.position.y = 2;
                  this.camera.position.z = 2;
                  this.camera.lookAt(new THREE.Vector3(0, 0, 0));
                  this.light = new THREE.DirectionalLight(0xffffff, 0.5);
                  this.light.position.set(0, 499, 0);
                  this.scene.add(this.light);
                  this.softLight = new THREE.AmbientLight(0xffffff, 0.4);
                  this.scene.add(this.softLight);
                  window.addEventListener("resize", function() { return _this.onResize(); });
                  this.onResize();
                }
                Stage.prototype.setCamera = function(y, speed) {
                  if (speed === void 0) { speed = 0.3; }
                  TweenLite.to(this.camera.position, speed, { y: y + 4, ease: Power1.easeInOut });
                  TweenLite.to(this.camera.lookAt, speed, { y: y, ease: Power1.easeInOut });
                };
                Stage.prototype.onResize = function() {
                  var viewSize = 30;
                  this.renderer.setSize(window.innerWidth, window.innerHeight);
                  this.camera.left = window.innerWidth / -viewSize;
                  this.camera.right = window.innerWidth / viewSize;
                  this.camera.top = window.innerHeight / viewSize;
                  this.camera.bottom = window.innerHeight / -viewSize;
                  this.camera.updateProjectionMatrix();
                };
                return Stage;
              })();
              var Block = (function() {
                function Block(block) {
                  this.STATES = { ACTIVE: "active", STOPPED: "stopped", MISSED: "missed" };
                  this.MOVE_AMOUNT = 12;
                  this.dimension = { width: 0, height: 0, depth: 0 };
                  this.position = { x: 0, y: 0, z: 0 };
                  this.targetBlock = block;
                  this.index = (this.targetBlock ? this.targetBlock.index : 0) + 1;
                  this.workingPlane = this.index % 2 ? "x" : "z";
                  this.workingDimension = this.index % 2 ? "width" : "depth";
                  this.dimension.width = this.targetBlock ? this.targetBlock.dimension.width : 10;
                  this.dimension.height = this.targetBlock ? this.targetBlock.dimension.height : 2;
                  this.dimension.depth = this.targetBlock ? this.targetBlock.dimension.depth : 10;
                  this.position.x = this.targetBlock ? this.targetBlock.position.x : 0;
                  this.position.y = this.dimension.height * this.index;
                  this.position.z = this.targetBlock ? this.targetBlock.position.z : 0;
                  this.colorOffset = this.targetBlock ? this.targetBlock.colorOffset : Math.round(Math.random() * 100);
                  if (!this.targetBlock) {
                    this.color = 0x333344;
                  } else {
                    var offset = this.index + this.colorOffset;
                    var r = Math.sin(0.3 * offset) * 55 + 200;
                    var g = Math.sin(0.3 * offset + 2) * 55 + 200;
                    var b = Math.sin(0.3 * offset + 4) * 55 + 200;
                    this.color = new THREE.Color(r / 255, g / 255, b / 255);
                  }
                  this.state = this.index > 1 ? this.STATES.ACTIVE : this.STATES.STOPPED;
                  this.speed = -0.1 - this.index * 0.005;
                  if (this.speed < -4) this.speed = -4;
                  this.direction = this.speed;
                  var geometry = new THREE.BoxGeometry(this.dimension.width, this.dimension.height, this.dimension.depth);
                  geometry.applyMatrix(new THREE.Matrix4().makeTranslation(this.dimension.width / 2, this.dimension.height / 2, this.dimension.depth / 2));
                  this.material = new THREE.MeshToonMaterial({ color: this.color, shading: THREE.FlatShading });
                  this.mesh = new THREE.Mesh(geometry, this.material);
                  this.mesh.position.set(this.position.x, this.position.y + (this.state == this.STATES.ACTIVE ? 0 : 0), this.position.z);
                  if (this.state == this.STATES.ACTIVE) {
                    this.position[this.workingPlane] = Math.random() > 0.5 ? -this.MOVE_AMOUNT : this.MOVE_AMOUNT;
                  }
                }
                Block.prototype.reverseDirection = function() {
                  this.direction = this.direction > 0 ? this.speed : Math.abs(this.speed);
                };
                Block.prototype.place = function() {
                  this.state = this.STATES.STOPPED;
                  var overlap = this.targetBlock.dimension[this.workingDimension] - Math.abs(this.position[this.workingPlane] - this.targetBlock.position[this.workingPlane]);
                  var blocksToReturn = { plane: this.workingPlane, direction: this.direction };
                  if (this.dimension[this.workingDimension] - overlap < 0.3) {
                    overlap = this.dimension[this.workingDimension];
                    blocksToReturn.bonus = true;
                    this.position.x = this.targetBlock.position.x;
                    this.position.z = this.targetBlock.position.z;
                    this.dimension.width = this.targetBlock.dimension.width;
                    this.dimension.depth = this.targetBlock.dimension.depth;
                  }
                  if (overlap > 0) {
                    var choppedDimensions = { width: this.dimension.width, height: this.dimension.height, depth: this.dimension.depth };
                    choppedDimensions[this.workingDimension] -= overlap;
                    this.dimension[this.workingDimension] = overlap;
                    var placedGeometry = new THREE.BoxGeometry(this.dimension.width, this.dimension.height, this.dimension.depth);
                    placedGeometry.applyMatrix(new THREE.Matrix4().makeTranslation(this.dimension.width / 2, this.dimension.height / 2, this.dimension.depth / 2));
                    var placedMesh = new THREE.Mesh(placedGeometry, this.material);
                    var choppedGeometry = new THREE.BoxGeometry(choppedDimensions.width, choppedDimensions.height, choppedDimensions.depth);
                    choppedGeometry.applyMatrix(new THREE.Matrix4().makeTranslation(choppedDimensions.width / 2, choppedDimensions.height / 2, choppedDimensions.depth / 2));
                    var choppedMesh = new THREE.Mesh(choppedGeometry, this.material);
                    var choppedPosition = { x: this.position.x, y: this.position.y, z: this.position.z };
                    if (this.position[this.workingPlane] < this.targetBlock.position[this.workingPlane]) {
                      this.position[this.workingPlane] = this.targetBlock.position[this.workingPlane];
                    } else {
                      choppedPosition[this.workingPlane] += overlap;
                    }
                    placedMesh.position.set(this.position.x, this.position.y, this.position.z);
                    choppedMesh.position.set(choppedPosition.x, choppedPosition.y, choppedPosition.z);
                    blocksToReturn.placed = placedMesh;
                    if (!blocksToReturn.bonus) blocksToReturn.chopped = choppedMesh;
                  } else {
                    this.state = this.STATES.MISSED;
                  }
                  this.dimension[this.workingDimension] = overlap;
                  return blocksToReturn;
                };
                Block.prototype.tick = function() {
                  if (this.state == this.STATES.ACTIVE) {
                    var value = this.position[this.workingPlane];
                    if (value > this.MOVE_AMOUNT || value < -this.MOVE_AMOUNT) this.reverseDirection();
                    this.position[this.workingPlane] += this.direction;
                    this.mesh.position[this.workingPlane] = this.position[this.workingPlane];
                  }
                };
                return Block;
              })();
              var Game = (function() {
                function Game() {
                  var _this = this;
                  this.STATES = { LOADING: "loading", PLAYING: "playing", READY: "ready", ENDED: "ended", RESETTING: "resetting" };
                  this.blocks = [];
                  this.state = this.STATES.LOADING;
                  this.stage = new Stage();
                  this.mainContainer = document.getElementById("container");
                  this.scoreContainer = document.getElementById("score");
                  this.startButton = document.getElementById("start-button");
                  this.instructions = document.getElementById("instructions");
                  this.scoreContainer.innerHTML = "0";
                  this.newBlocks = new THREE.Group();
                  this.placedBlocks = new THREE.Group();
                  this.choppedBlocks = new THREE.Group();
                  this.stage.add(this.newBlocks);
                  this.stage.add(this.placedBlocks);
                  this.stage.add(this.choppedBlocks);
                  this.addBlock();
                  this.tick();
                  this.updateState(this.STATES.READY);
                  document.addEventListener("keydown", function(e) { if (e.keyCode == 32) _this.onAction(); });
                  document.addEventListener("click", function(e) { _this.onAction(); });
                  document.addEventListener("touchstart", function(e) { e.preventDefault(); });
                }
                Game.prototype.updateState = function(newState) {
                  for (var key in this.STATES) this.mainContainer.classList.remove(this.STATES[key]);
                  this.mainContainer.classList.add(newState);
                  this.state = newState;
                };
                Game.prototype.onAction = function() {
                  switch (this.state) {
                    case this.STATES.READY: this.startGame(); break;
                    case this.STATES.PLAYING: this.placeBlock(); break;
                    case this.STATES.ENDED: this.restartGame(); break;
                  }
                };
                Game.prototype.startGame = function() {
                  if (this.state != this.STATES.PLAYING) {
                    this.scoreContainer.innerHTML = "0";
                    this.updateState(this.STATES.PLAYING);
                    this.addBlock();
                  }
                };
                Game.prototype.restartGame = function() {
                  var _this = this;
                  this.updateState(this.STATES.RESETTING);
                  var oldBlocks = this.placedBlocks.children;
                  var removeSpeed = 0.2;
                  var delayAmount = 0.02;
                  var _loop_1 = function(i) {
                    TweenLite.to(oldBlocks[i].scale, removeSpeed, { x: 0, y: 0, z: 0, delay: (oldBlocks.length - i) * delayAmount, ease: Power1.easeIn, onComplete: function() { return _this.placedBlocks.remove(oldBlocks[i]); } });
                    TweenLite.to(oldBlocks[i].rotation, removeSpeed, { y: 0.5, delay: (oldBlocks.length - i) * delayAmount, ease: Power1.easeIn });
                  };
                  for (var i = 0; i < oldBlocks.length; i++) { _loop_1(i); }
                  var cameraMoveSpeed = removeSpeed * 2 + oldBlocks.length * delayAmount;
                  this.stage.setCamera(2, cameraMoveSpeed);
                  var countdown = { value: this.blocks.length - 1 };
                  TweenLite.to(countdown, cameraMoveSpeed, { value: 0, onUpdate: function() { _this.scoreContainer.innerHTML = String(Math.round(countdown.value)); } });
                  this.blocks = this.blocks.slice(0, 1);
                  setTimeout(function() { _this.startGame(); }, cameraMoveSpeed * 1000);
                };
                Game.prototype.placeBlock = function() {
                  var _this = this;
                  var currentBlock = this.blocks[this.blocks.length - 1];
                  var newBlocks = currentBlock.place();
                  this.newBlocks.remove(currentBlock.mesh);
                  if (newBlocks.placed) this.placedBlocks.add(newBlocks.placed);
                  if (newBlocks.chopped) {
                    this.choppedBlocks.add(newBlocks.chopped);
                    var positionParams = { y: "-=30", ease: Power1.easeIn, onComplete: function() { return _this.choppedBlocks.remove(newBlocks.chopped); } };
                    var rotateRandomness = 10;
                    var rotationParams = { delay: 0.05, x: newBlocks.plane == "z" ? Math.random() * rotateRandomness - rotateRandomness / 2 : 0.1, z: newBlocks.plane == "x" ? Math.random() * rotateRandomness - rotateRandomness / 2 : 0.1, y: Math.random() * 0.1 };
                    if (newBlocks.chopped.position[newBlocks.plane] > newBlocks.placed.position[newBlocks.plane]) {
                      positionParams[newBlocks.plane] = "+=" + 40 * Math.abs(newBlocks.direction);
                    } else {
                      positionParams[newBlocks.plane] = "-=" + 40 * Math.abs(newBlocks.direction);
                    }
                    TweenLite.to(newBlocks.chopped.position, 1, positionParams);
                    TweenLite.to(newBlocks.chopped.rotation, 1, rotationParams);
                  }
                  this.addBlock();
                };
                Game.prototype.addBlock = function() {
                  var lastBlock = this.blocks[this.blocks.length - 1];
                  if (lastBlock && lastBlock.state == lastBlock.STATES.MISSED) {
                    return this.endGame();
                  }
                  this.scoreContainer.innerHTML = String(this.blocks.length - 1);
                  var newKidOnTheBlock = new Block(lastBlock);
                  this.newBlocks.add(newKidOnTheBlock.mesh);
                  this.blocks.push(newKidOnTheBlock);
                  this.stage.setCamera(this.blocks.length * 2);
                  if (this.blocks.length >= 5) this.instructions.classList.add("hide");
                };
                Game.prototype.endGame = function() {
                  this.updateState(this.STATES.ENDED);
                };
                Game.prototype.tick = function() {
                  var _this = this;
                  this.blocks[this.blocks.length - 1].tick();
                  this.stage.render();
                  requestAnimationFrame(function() { _this.tick(); });
                };
                return Game;
              })();
              var game = new Game();
            </script>
          </body>
          </html>
          HTML_MAIN_EOF

          cp company_logo.png www/company_logo.png

      - name: Install dependencies
        run: npm install

      - name: Init Capacitor
        run: |
          npx cap init "TOWER Rush" "com.towerrush.app" --web-dir=www
          npx cap add android

      - name: Generate app icons from logo.png
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          convert logo.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert logo.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert logo.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert logo.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert logo.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

      - name: Copy web assets
        run: npx cap copy android

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TOWER-Rush-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
